name: Sync Upstream Tags

on:
  workflow_dispatch:      # Manually triggerable
  push:                   # Runs after "Sync fork" button
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Can be disabled by setting repository variable DATA_HELPERS_SYNC_UPSTREAM_TAGS=false
      SYNC_ENABLED: ${{ vars.DATA_HELPERS_SYNC_UPSTREAM_TAGS != 'false' }}

    steps:
      - name: Check if sync is enabled
        id: check-enabled
        run: |
          if [ "${{ env.SYNC_ENABLED }}" = "false" ]; then
            echo "⚠️  Tag sync is disabled via DATA_HELPERS_SYNC_UPSTREAM_TAGS variable"
            echo "enabled=false" >> $GITHUB_OUTPUT
          else
            echo "✅  Tag sync is enabled"
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Fork
        if: steps.check-enabled.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if repository is a fork
        if: steps.check-enabled.outputs.enabled == 'true'
        id: check-fork
        run: |
          if [ "${{ github.repository }}" = "event4u-app/data-helpers" ]; then
            echo "ℹ️  This is the original repository, skipping tag sync"
            echo "is_fork=false" >> $GITHUB_OUTPUT
          else
            echo "✅  This is a fork, proceeding with tag sync"
            echo "is_fork=true" >> $GITHUB_OUTPUT
          fi

      - name: Add upstream remote
        if: steps.check-enabled.outputs.enabled == 'true' && steps.check-fork.outputs.is_fork == 'true'
        run: |
          echo "Adding upstream remote..."
          if git remote | grep -q "^upstream$"; then
            echo "Upstream remote already exists, removing it first..."
            git remote remove upstream
          fi
          git remote add upstream https://github.com/event4u-app/data-helpers.git
          echo "✅  Upstream remote added successfully"
          git remote -v

      - name: Fetch upstream tags
        if: steps.check-enabled.outputs.enabled == 'true' && steps.check-fork.outputs.is_fork == 'true'
        run: |
          echo "Fetching tags from upstream..."
          git fetch upstream --tags --verbose
          echo ""
          echo "✅  Tags successfully fetched from upstream"
          echo "Total upstream tags: $(git tag -l | wc -l)"
          echo ""

      - name: Compare tags between upstream and fork
        if: steps.check-enabled.outputs.enabled == 'true' && steps.check-fork.outputs.is_fork == 'true'
        run: |
          echo "🔍 Comparing tags between upstream and origin..."
          NEW_TAGS=0
          UPDATED_TAGS=0

          git fetch origin --tags > /dev/null 2>&1

          for tag in $(git tag -l); do
            UPSTREAM_COMMIT=$(git rev-list -n 1 upstream/main "$tag" 2>/dev/null || git rev-list -n 1 "$tag")
            ORIGIN_COMMIT=$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')

            if [ -z "$ORIGIN_COMMIT" ]; then
              echo "🆕  New tag: $tag"
              ((NEW_TAGS++))
            elif [ "$UPSTREAM_COMMIT" != "$ORIGIN_COMMIT" ]; then
              echo "♻️  Updated tag: $tag (different commit)"
              ((UPDATED_TAGS++))
            fi
          done

          echo ""
          echo "Summary:"
          echo "→ New tags to push: $NEW_TAGS"
          echo "→ Updated tags to overwrite: $UPDATED_TAGS"
          echo ""

      - name: Push tags to fork
        if: steps.check-enabled.outputs.enabled == 'true' && steps.check-fork.outputs.is_fork == 'true'
        run: |
          echo "🚀 Pushing all tags from upstream to fork..."
          git push origin --force --tags
          echo ""
          echo "✅  All tags successfully synced from upstream to fork!"
