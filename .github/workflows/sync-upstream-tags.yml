name: Sync Upstream Tags

on:
  workflow_dispatch:      # Manually triggerable
  push:                   # Runs after "Sync fork" button
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check if PAT is configured
        id: check-pat
        run: |
          if [ -z "${{ secrets.DATA_HELPERS_PAT }}" ]; then
            echo "⚠️  DATA_HELPERS_PAT secret is not configured"
            echo "⚠️  Tag sync will be skipped"
            echo "⚠️  See .github/workflows/README.md for setup instructions"
            echo "has_pat=false" >> $GITHUB_OUTPUT
          else
            echo "✅  DATA_HELPERS_PAT is configured"
            echo "has_pat=true" >> $GITHUB_OUTPUT
          fi
      - name: Checkout Fork
        if: steps.check-pat.outputs.has_pat == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.DATA_HELPERS_PAT }}

      - name: Check if repository is a fork
        if: steps.check-pat.outputs.has_pat == 'true'
        id: check-fork
        run: |
          if [ "${{ github.repository }}" = "event4u-app/data-helpers" ]; then
            echo "ℹ️  This is the original repository, skipping tag sync"
            echo "is_fork=false" >> $GITHUB_OUTPUT
          else
            echo "✅  This is a fork, proceeding with tag sync"
            echo "is_fork=true" >> $GITHUB_OUTPUT
          fi

      - name: Add upstream remote
        if: steps.check-pat.outputs.has_pat == 'true' && steps.check-fork.outputs.is_fork == 'true'
        run: |
          echo "Adding upstream remote..."
          if git remote | grep -q "^upstream$"; then
            echo "Upstream remote already exists, removing it first..."
            git remote remove upstream
          fi
          git remote add upstream https://github.com/event4u-app/data-helpers.git
          echo "✅  Upstream remote added successfully"
          git remote -v

      - name: Fetch upstream tags
        if: steps.check-pat.outputs.has_pat == 'true' && steps.check-fork.outputs.is_fork == 'true'
        run: |
          echo "Fetching tags from upstream..."
          # Use --force to update existing tags locally (doesn't affect remote yet)
          git fetch upstream 'refs/tags/*:refs/tags/*' --force --verbose
          echo ""
          echo "✅  Tags successfully fetched from upstream"
          echo "Total tags: $(git tag -l | wc -l)"
          echo ""
          echo "Tags:"
          git tag -l
          echo ""

      - name: Push new tags to fork
        if: steps.check-pat.outputs.has_pat == 'true' && steps.check-fork.outputs.is_fork == 'true'
        run: |
          echo "🚀 Pushing only new tags to fork..."
          echo ""

          new_tags=0
          skipped_tags=0

          # Get all tags from origin
          git ls-remote --tags origin > /tmp/origin_tags.txt

          # Loop through all local tags (from upstream)
          for tag in $(git tag -l); do
            # Check if tag already exists on origin
            if grep -q "refs/tags/$tag$" /tmp/origin_tags.txt; then
              echo "⏭️  Skipping existing tag: $tag"
              skipped_tags=$((skipped_tags + 1))
            else
              echo "📤  Pushing new tag: $tag"
              git push origin "refs/tags/$tag"
              new_tags=$((new_tags + 1))
            fi
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅  Tag sync complete!"
          echo "   📤 New tags pushed: $new_tags"
          echo "   ⏭️  Existing tags skipped: $skipped_tags"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
